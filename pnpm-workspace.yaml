packages:
  - "packages/*"

# catalog:toolchain — compilers / types / Vite
# catalog:app — runtime libraries (server + admin UI)
# Internal packages stay workspace:*.
catalogs:
  linters:
    "@eslint/js": ^10.0.1
    "@stylistic/eslint-plugin": ^5.10.0
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-import-x: 4.17.0
    eslint-plugin-unused-imports: 4.4.1
    eslint-plugin-vue: ^10.9.2
    eslint: ^10.6.0
    globals: ^16.3.0
    typescript-eslint: ^8.62.0
    vue-eslint-parser: ^10.4.1

  toolchain:
    typescript: ^5.9.3
    tsx: ^4.23.5
    vitest: ^3.2.4
    "@types/node": ^22.13.10
    "@types/ws": ^8.18.0
    vite: ^7.0.6
    vue-tsc: ^3.0.4
    "@vitejs/plugin-vue": ^6.0.1
    "@tailwindcss/vite": ^4.1.11
    tailwindcss: ^4.1.11
  app:
    hono: ^4.7.5
    "@hono/node-server": ^1.14.1
    ws: ^8.18.1
    zod: ^3.24.2
    "@electron/asar": ^3.3.1
    vue: ^3.5.18
    vue-router: ^4.5.1
    pinia: ^3.0.3
    "@yume-chan/adb": ^2.6.2
    "@yume-chan/adb-daemon-webusb": ^2.3.2
    "@yume-chan/stream-extra": ^2.6.1

allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
